# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained crates pulled in by the Tauri/GTK stack are reported but not fatal.
unmaintained = "workspace"
ignore = [
    # zip 4.x, pulled in by tauri-plugin-updater: the advisories concern
    # `ZipArchive::extract` of untrusted archives. The updater only extracts
    # zip files on Windows (RED ships for macOS and Linux) and only after
    # the update's signature has been verified. Drop these once the updater
    # moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip extraction is Windows-only in tauri-plugin-updater, after signature checks" },
    { id = "RUSTSEC-2026-0368", reason = "zip extraction is Windows-only in tauri-plugin-updater, after signature checks" },
    { id = "RUSTSEC-2026-0369", reason = "zip extraction is Windows-only in tauri-plugin-updater, after signature checks" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

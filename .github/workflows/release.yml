name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build CLI, daemon and helper
        run: cargo build --release --locked --target ${{ matrix.target }} -p red-cli -p red-daemon -p red-helper
      - name: Package
        shell: bash
        run: |
          name="red-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for bin in red redd red-helper; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          done
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  app:
    name: Desktop app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/gui
      - name: Build the bundled CLI, daemon and helper
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p red-cli -p red-daemon -p red-helper
          mkdir -p apps/gui/src-tauri/binaries
          for bin in red redd red-helper; do
            cp "target/${{ matrix.target }}/release/$bin" "apps/gui/src-tauri/binaries/$bin-${{ matrix.target }}"
          done
      - name: Build RED.app and the disk image
        working-directory: apps/gui
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app,dmg --config src-tauri/tauri.bundle.conf.json
      - name: Collect the disk image
        shell: bash
        run: |
          mkdir -p dist
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg | head -1)
          cp "$dmg" "dist/RED-${GITHUB_REF_NAME}-macos-$arch.dmg"
          (cd dist && shasum -a 256 *.dmg > "RED-${GITHUB_REF_NAME}-macos-$arch.dmg.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: [build, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

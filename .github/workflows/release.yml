name: Release

# Builds the command-line tools and the desktop app for a `v*` tag and
# publishes them on a GitHub release. Optional, each enabled by its secrets
# (see docs/releasing.md):
#   - Developer ID signing + notarization  (APPLE_CERTIFICATE, ...)
#   - app auto-update                       (TAURI_SIGNING_PRIVATE_KEY + vars.TAURI_UPDATER_PUBKEY)
#   - Homebrew tap                          (HOMEBREW_TAP_TOKEN)
# Without them the release still works: binaries are ad-hoc signed, the app
# does not update itself, and the tap is left alone.

on:
  push:
    tags: ["v*"]
  # Dry run from the Actions tab: builds everything and keeps the files as
  # workflow artifacts, but publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
          # Ubuntu 22.04 (glibc 2.35), so the binaries run on older distributions too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build CLI, daemon and helper
        run: cargo build --release --locked --target ${{ matrix.target }} -p red-cli -p red-daemon -p red-helper
      - name: Signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/release/import-certificate.sh
      - name: Sign and notarize
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/sign-binaries.sh "target/${{ matrix.target }}/release"
      - name: Package
        shell: bash
        run: |
          name="red-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          for bin in red redd red-helper; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$name/"
          done
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  app:
    name: Desktop app (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.os }}
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/gui
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file
      - name: Signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: scripts/release/import-certificate.sh
      - name: Build the bundled CLI, daemon and helper
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p red-cli -p red-daemon -p red-helper
          mkdir -p apps/gui/src-tauri/binaries
          for bin in red redd red-helper; do
            cp "target/${{ matrix.target }}/release/$bin" "apps/gui/src-tauri/binaries/$bin-${{ matrix.target }}"
          done
      - name: Release configuration
        env:
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          REPO: ${{ github.repository }}
        run: |
          config=apps/gui/src-tauri/tauri.bundle.conf.json
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            config=$(jq --arg id "$APPLE_SIGNING_IDENTITY" '.bundle.macOS.signingIdentity = $id' <<<"$(cat "$config")")
          else
            config=$(cat "$config")
          fi
          if [ "$HAS_UPDATER_KEY" = "true" ]; then
            if [ -z "$UPDATER_PUBKEY" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but the TAURI_UPDATER_PUBKEY variable is not"
              exit 1
            fi
            config=$(jq --arg key "$UPDATER_PUBKEY" \
              --arg url "https://github.com/$REPO/releases/latest/download/latest.json" \
              '.bundle.createUpdaterArtifacts = true | .plugins.updater = {pubkey: $key, endpoints: [$url]}' <<<"$config")
          fi
          echo "$config" > "$RUNNER_TEMP/release.conf.json"
          cat "$RUNNER_TEMP/release.conf.json"
      - name: Build the app bundles
        working-directory: apps/gui
        env:
          SIGNING_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_KEY_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Tauri reacts to these being set at all, so only set non-empty ones.
          if [ -n "$SIGNING_KEY_SECRET" ]; then
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY_SECRET"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_KEY_PASSWORD_SECRET"
          fi
          # Tauri notarizes when these are set; only set them when all are there.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ -n "$APPLE_ID_SECRET" ] \
             && [ -n "$APPLE_PASSWORD_SECRET" ] && [ -n "$APPLE_TEAM_ID_SECRET" ]; then
            export APPLE_ID="$APPLE_ID_SECRET" APPLE_PASSWORD="$APPLE_PASSWORD_SECRET" APPLE_TEAM_ID="$APPLE_TEAM_ID_SECRET"
          fi
          pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/release.conf.json"
      - name: Collect the packages and update archives
        shell: bash
        run: |
          mkdir -p dist
          arch="${{ matrix.target }}"; arch="${arch%%-*}"
          bundle="target/${{ matrix.target }}/release/bundle"
          name="RED-${GITHUB_REF_NAME}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            dmg=$(find "$bundle/dmg" -name "*.dmg" | head -1)
            cp "$dmg" "dist/$name-macos-$arch.dmg"
            if [ "$HAS_UPDATER_KEY" = "true" ]; then
              cp "$bundle/macos/RED.app.tar.gz" "dist/$name-macos-$arch.app.tar.gz"
              cp "$bundle/macos/RED.app.tar.gz.sig" "dist/$name-macos-$arch.app.tar.gz.sig"
            fi
          else
            deb=$(find "$bundle/deb" -name "*.deb" | head -1)
            cp "$deb" "dist/$name-linux-$arch.deb"
            if [ -f "$deb.sig" ]; then
              cp "$deb.sig" "dist/$name-linux-$arch.deb.sig"
            fi
            appimage=$(find "$bundle/appimage" -name "*.AppImage" 2>/dev/null | head -1)
            if [ -n "$appimage" ]; then
              cp "$appimage" "dist/$name-linux-$arch.AppImage"
              # The AppImage is its own update archive.
              if [ -f "$appimage.sig" ]; then
                cp "$appimage.sig" "dist/$name-linux-$arch.AppImage.sig"
              fi
            fi
          fi
          cd dist
          for file in *.dmg *.app.tar.gz *.deb *.AppImage; do
            if [ -f "$file" ]; then shasum -a 256 "$file" > "$file.sha256"; fi
          done
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.target }}
          path: dist/*

  release:
    name: Publish release
    needs: [build, app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found' CHANGELOG.md > notes.md
      - name: Update manifest for the desktop app
        run: |
          shopt -s nullglob
          archives=(dist/*.app.tar.gz dist/*.AppImage.sig dist/*.deb.sig)
          if [ ${#archives[@]} -gt 0 ]; then
            python3 scripts/release/updater-manifest.py "$GITHUB_REF_NAME" notes.md \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME" dist > dist/latest.json
            cat dist/latest.json
          fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

  homebrew:
    name: Homebrew tap
    needs: release
    runs-on: ubuntu-24.04
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || format('{0}/homebrew-red', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.TAP_TOKEN != ''
        with:
          path: dist
          merge-multiple: true
      - name: Update the formula and the cask
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          python3 scripts/release/homebrew.py "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" dist tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks 2>/dev/null || git add Formula
          if git diff --cached --quiet; then
            echo "tap already up to date"
          else
            git commit -m "red ${GITHUB_REF_NAME#v}"
            git push
          fi
      - name: Skipped
        if: env.TAP_TOKEN == ''
        run: echo "HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated."

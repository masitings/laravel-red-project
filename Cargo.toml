[workspace]
resolver = "3"
members = ["crates/*", "apps/gui/src-tauri"]
default-members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["RED Project contributors"]
publish = false

[workspace.dependencies]
# internal
red-core = { path = "crates/red-core" }
red-api = { path = "crates/red-api" }
red-platform = { path = "crates/red-platform" }
red-daemon = { path = "crates/red-daemon" }

# async + http
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs", "io-util", "process"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service", "http1"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tokio-util = "0.7"

# data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
percent-encoding = "2"
mime_guess = "2"
ts-rs = { version = "11", features = ["serde-compat"] }

# cli + diagnostics
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# platform
directories = "6"
rustix = { version = "1", features = ["process"] }

# tests
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
